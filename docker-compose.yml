services:
  postgres:
    image: postgres:16-alpine
    container_name: qingwen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qingwen
      POSTGRES_PASSWORD: qingwen_dev_pwd
      POSTGRES_DB: qingwen
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qingwen -d qingwen"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qingwen-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data: